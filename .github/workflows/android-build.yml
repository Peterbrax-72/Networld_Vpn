name: Android APK

# Builds an installable, signed Networld VPN APK for Android phones.
#   - push to main         -> APK is uploaded as the "NetworldVPN-android" artifact
#   - push a tag  vX.Y.Z   -> APK is attached to the GitHub release
#   - manual run           -> APK is uploaded as the "NetworldVPN-android" artifact
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS to keep one stable signing key (needed to update an installed
# app). Without them a throw-away key is generated: fine for testing, but each
# build then has a different signature.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "branding/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; install just what we
      # need with its own sdkmanager (android-actions/setup-android stalled on
      # the licence prompt).
      - name: Install Android SDK pieces (NDK, platform, build-tools)
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install front-end dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx tauri android init --ci

      - name: Add the VPN service (Kotlin + manifest)
        run: python3 packaging/android/patch-android-project.py

      - name: Build release APK (arm64 + arm32 + x86_64)
        run: npx tauri android build --apk

      - name: Sign the APK
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          APK=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          [ -n "$APK" ] || { echo "no unsigned APK found"; find src-tauri/gen/android -name '*.apk'; exit 1; }
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            ALIAS="${KS_ALIAS:-networld}"; PASS="$KS_PASS"
          else
            echo "::warning::No signing secrets set - using a throw-away key (updates over an older install will fail)"
            PASS=networld-temp; ALIAS=networld
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Networld VPN"
          fi
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out NetworldVPN.apk aligned.apk
          "$BT/apksigner" verify --verbose NetworldVPN.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: NetworldVPN-android
          path: NetworldVPN.apk
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NetworldVPN.apk
