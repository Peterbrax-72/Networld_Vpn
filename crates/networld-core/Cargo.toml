[package]
name = "networld-core"
description = "Networld VPN tunneling core — transports, payload injector, SSH, local proxies, engine slots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "networld_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
  "process",
  "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.23"
dirs = "5"
percent-encoding = "2"

# TLS / SNI (bug host) support
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
webpki-roots = "1"

# SSH engine
russh = { version = "0.64", default-features = false, features = [
  "ring",
  "flate2",
  "rsa",
] }

# Locked / encrypted config payloads (.nw).
# Versions match what russh already pulls in, so AES/SHA are compiled once for
# the whole binary instead of twice.
aes-gcm = "0.11"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
