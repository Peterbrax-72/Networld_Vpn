[package]
name = "networld-vpn"
description = "Networld VPN — NetMod-style multi-protocol tunnelling client for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "networld-vpn"

[lib]
name = "networld_vpn_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "networld-vpn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
networld-core = { path = "../crates/networld-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Android: device-wide VPN = Android VpnService (Kotlin) + tun2proxy, which turns
# the TUN packets into SOCKS5 connections to Networld's local proxy.
[target.'cfg(target_os = "android")'.dependencies]
tun2proxy = { version = "0.8", default-features = false, features = ["udpgw"] }
log = "0.4"

[features]
# Enabled for the Microsoft Store / MSIX build: hides engines that need
# administrator rights or a helper service (WireGuard, TUN mode).
store = []
# Embed the built UI (../dist) in the exe. Without it a plain `cargo build
# --release` binary tries to load the dev server at http://localhost:1420 and
# shows a blank/error window. `tauri build` turns this on by itself; direct
# cargo builds (CI portable exe, MSIX) must pass it.
custom-protocol = ["tauri/custom-protocol"]
